# Link your own project before deploying:  supabase link --project-ref <your-project-ref>
# (the previous project reference belonged to the old church website and has been removed)

[functions.farm-ai]
verify_jwt = true

# WhatsApp / SMS / email notifications. Needs a signed-in farm member; recipients come from the database, never from the browser.
[functions.notify]
verify_jwt = true

# Paynow's result URL has no user token; the function checks user calls itself and never trusts the posted payment status.
[functions.paynow]
verify_jwt = false

# Daily alert digest: called by the database scheduler with a shared secret (x-cron-secret), not by users.
[functions.notify-digest]
verify_jwt = false
